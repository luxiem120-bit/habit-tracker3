<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura - 個人學習與待辦空間</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;               /* 深灰藍底色 */
      --panel: #1e293b;            /* 灰藍卡片色 */
      --panel-hover: #334155;
      --card-border: #475569;
      --primary: #3b82f6;          /* 質感藍 */
      --primary-hover: #2563eb;
      --accent: #10b981;           /* 綠色標示 */
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 12px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 頂欄 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .user-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 分頁選單 (Tabs) */
    .tab-nav {
      display: flex;
      gap: 8px;
      background: var(--panel);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      overflow-x: auto;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 16px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
    }

    /* 分頁內容區塊 */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input, select, button {
      font-size: 14px;
      border-radius: 8px;
      outline: none;
      transition: all 0.2s;
    }

    input, select {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 9px 12px;
    }

    input:focus { border-color: var(--primary); }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 9px 16px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover { background: var(--primary-hover); }

    /* 清單項目 */
    .list-item {
      background: rgba(15, 23, 42, 0.6);
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--card-border);
    }

    .list-item.done span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* 單字本卡片列表 */
    .deck-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 15px;
    }

    .deck-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .deck-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .quiz-box {
      background: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-top: 15px;
      border: 1px solid var(--card-border);
    }

    /* 計算機 */
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .calc-screen {
      grid-column: span 4;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--card-border);
      color: var(--accent);
      font-family: monospace;
      font-size: 1.8rem;
      text-align: right;
      padding: 12px;
      border-radius: 10px;
    }

    .btn-calc {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      padding: 14px;
      font-size: 1.1rem;
    }

    .btn-calc-op { background: var(--primary); }
    .btn-delete { background: transparent; color: var(--danger); font-size: 12px; padding: 2px 6px; }
    .chart-container { position: relative; height: 260px; width: 100%; }
    .checkbox-custom { width: 18px; height: 18px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📚 Aura Workspace</h1>
      <div class="user-section">
        <span id="userStatus" style="font-size: 0.85rem; color: var(--text-muted);">未登入</span>
        <input type="text" id="usernameInput" placeholder="輸入用戶名" style="width: 100px;">
        <button onclick="loginUser()">切換帳號</button>
      </div>
    </header>

    <!-- 分頁選單 -->
    <div class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('vocabTab')">📖 多功能單字本</button>
      <button class="tab-btn" onclick="switchTab('todoTab')">✅ To-Do List</button>
      <button class="tab-btn" onclick="switchTab('timeTab')">⏰ 作息輪盤</button>
      <button class="tab-btn" onclick="switchTab('statsTab')">📊 數據分析</button>
      <button class="tab-btn" onclick="switchTab('calcTab')">🧮 計算機</button>
    </div>

    <!-- 分頁 1: 多功能單字本 -->
    <div id="vocabTab" class="tab-content active">
      <!-- 視圖 A: 單字本列表 (Decks) -->
      <div id="deckListView" class="card">
        <div class="card-title">
          <span>📚 我的單字本庫</span>
        </div>
        <div style="display: flex; gap: 8px; margin-bottom: 20px;">
          <input type="text" id="newDeckName" placeholder="新單字本名稱 (如: 多益高頻單字)" style="flex:1;">
          <button onclick="createDeck()">建立單字本</button>
        </div>
        <div class="deck-grid" id="deckGrid"></div>
      </div>

      <!-- 視圖 B: 單字本內部 details -->
      <div id="deckDetailView" class="card" style="display: none;">
        <div class="card-title">
          <span id="currentDeckTitle">單字本內容</span>
          <button style="font-size: 0.8rem;" onclick="backToDecks()">← 返回單字本庫</button>
        </div>

        <div style="font-size: 0.85rem; color: var(--accent); margin-bottom: 12px;" id="deckProgress">學習進度：0%</div>

        <!-- 新增單字 -->
        <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px;">
          <div style="display: flex; gap: 8px;">
            <input type="text" id="vocabWord" placeholder="英文單字" style="flex:1;">
            <input type="text" id="vocabMeaning" placeholder="中文解釋" style="flex:1;">
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <label style="font-size: 0.8rem; color: var(--text-muted);">初學時間：</label>
            <input type="datetime-local" id="vocabDate" style="flex:1;">
            <button onclick="addVocab()">新增單字</button>
          </div>
        </div>

        <!-- 測驗區域 -->
        <div class="quiz-box">
          <div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap;">
            <button style="font-size: 0.8rem;" onclick="startQuiz('en-zh')">英翻中</button>
            <button style="font-size: 0.8rem;" onclick="startQuiz('zh-en')">中翻英</button>
            <button style="font-size: 0.8rem;" onclick="startQuiz('audio')">🔊 聽力</button>
            <button style="font-size: 0.8rem;" onclick="startQuiz('spelling')">⌨️ 拼字</button>
          </div>
          <div id="quizArea" style="display: none;">
            <div style="font-size: 1.2rem; font-weight: bold; margin-bottom: 10px;" id="quizQuestion">---</div>
            <div id="quizInputArea" style="margin-bottom: 10px;"></div>
            <button onclick="checkAnswer()">提交答案</button>
            <div id="quizResult" style="margin-top: 8px; font-size: 0.85rem;"></div>
          </div>
        </div>

        <div style="margin-top: 15px; max-height: 280px; overflow-y: auto;" id="vocabList"></div>
      </div>
    </div>

    <!-- 分頁 2: To-Do List 待辦事項 -->
    <div id="todoTab" class="tab-content">
      <div class="card">
        <div class="card-title">✅ 每日待辦事項 (To-Do List)</div>
        <div style="display: flex; gap: 8px; margin-bottom: 15px;">
          <input type="text" id="todoInput" placeholder="新增待辦任務..." style="flex: 1;">
          <button onclick="addTodo()">新增任務</button>
        </div>
        <div id="todoList" style="max-height: 350px; overflow-y: auto;"></div>
      </div>
    </div>

    <!-- 分頁 3: 時間作息輪盤 -->
    <div id="timeTab" class="tab-content">
      <div class="grid-2">
        <div class="card">
          <div class="card-title">⏰ 24H 時間作息圓盤</div>
          <div class="chart-container">
            <canvas id="wheelChart"></canvas>
          </div>
        </div>

        <div class="card">
          <div class="card-title">📝 作息規劃紀錄</div>
          <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
            <input type="text" id="timeItemName" placeholder="事項 (如: 睡眠)" style="flex: 2;">
            <input type="time" id="startTime" style="flex: 1;">
            <input type="time" id="endTime" style="flex: 1;">
            <button onclick="addTimeLog()">加</button>
          </div>
          <div id="timeLogList" style="max-height: 220px; overflow-y: auto;"></div>
        </div>
      </div>
    </div>

    <!-- 分頁 4: 數據分析 -->
    <div id="statsTab" class="tab-content">
      <div class="card">
        <div class="card-title">📊 專注與習慣趨勢</div>
        <div class="chart-container">
          <canvas id="statsChart"></canvas>
        </div>
      </div>
    </div>

    <!-- 分頁 5: 計算機 -->
    <div id="calcTab" class="tab-content">
      <div class="card" style="max-width: 380px; margin: 0 auto;">
        <div class="card-title">🧮 輕量計算機</div>
        <div class="calc-screen" id="calcScreen">0</div>
        <div class="calc-grid">
          <button class="btn-calc" onclick="calcInput('C')">C</button>
          <button class="btn-calc" onclick="calcInput('(')">(</button>
          <button class="btn-calc" onclick="calcInput(')')">)</button>
          <button class="btn-calc btn-calc-op" onclick="calcInput('/')">/</button>

          <button class="btn-calc" onclick="calcInput('7')">7</button>
          <button class="btn-calc" onclick="calcInput('8')">8</button>
          <button class="btn-calc" onclick="calcInput('9')">9</button>
          <button class="btn-calc btn-calc-op" onclick="calcInput('*')">*</button>

          <button class="btn-calc" onclick="calcInput('4')">4</button>
          <button class="btn-calc" onclick="calcInput('5')">5</button>
          <button class="btn-calc" onclick="calcInput('6')">6</button>
          <button class="btn-calc btn-calc-op" onclick="calcInput('-')">-</button>

          <button class="btn-calc" onclick="calcInput('1')">1</button>
          <button class="btn-calc" onclick="calcInput('2')">2</button>
          <button class="btn-calc" onclick="calcInput('3')">3</button>
          <button class="btn-calc btn-calc-op" onclick="calcInput('+')">+</button>

          <button class="btn-calc" onclick="calcInput('0')">0</button>
          <button class="btn-calc" onclick="calcInput('.')">.</button>
          <button class="btn-calc btn-calc-op" style="grid-column: span 2;" onclick="calcInput('=')">=</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 初始化時間
    const nowISO = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    document.getElementById('vocabDate').value = nowISO;

    let currentUser = localStorage.getItem('aura_currentUser') || 'Default';
    let currentDeckId = null;
    let wheelChartInstance = null;
    let statsChartInstance = null;

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');

      if (tabId === 'timeTab') renderWheelChart();
      if (tabId === 'statsTab') renderStatsChart();
    }

    function loginUser() {
      const name = document.getElementById('usernameInput').value.trim();
      if (!name) return;
      currentUser = name;
      localStorage.setItem('aura_currentUser', currentUser);
      updateUserUI();
      loadUserData();
    }

    function updateUserUI() {
      document.getElementById('userStatus').innerText = `👤 使用者: ${currentUser}`;
    }

    // --- 資料結構 ---
    let decks = [];
    let todos = [];
    let timeLogs = [];

    function loadUserData() {
      decks = JSON.parse(localStorage.getItem(`decks_${currentUser}`)) || [
        { id: 1, name: "預設單字本", vocabs: [] }
      ];
      todos = JSON.parse(localStorage.getItem(`todos_${currentUser}`)) || [
        { id: 1, text: "完成今天的英文複習", done: false }
      ];
      timeLogs = JSON.parse(localStorage.getItem(`timeLogs_${currentUser}`)) || [
        { id: 1, name: '睡眠', start: '00:00', end: '07:00' }
      ];

      renderDecks();
      renderTodos();
      renderTimeLogs();
      renderWheelChart();
    }

    function saveUserData() {
      localStorage.setItem(`decks_${currentUser}`, JSON.stringify(decks));
      localStorage.setItem(`todos_${currentUser}`, JSON.stringify(todos));
      localStorage.setItem(`timeLogs_${currentUser}`, JSON.stringify(timeLogs));
      renderDecks();
      renderTodos();
      renderTimeLogs();
      if (currentDeckId) renderDeckDetail();
    }

    // --- 多單字本邏輯 ---
    function createDeck() {
      const name = document.getElementById('newDeckName').value.trim();
      if (!name) return;
      decks.push({ id: Date.now(), name, vocabs: [] });
      document.getElementById('newDeckName').value = '';
      saveUserData();
    }

    function deleteDeck(id, event) {
      event.stopPropagation();
      decks = decks.filter(d => d.id !== id);
      saveUserData();
    }

    function openDeck(id) {
      currentDeckId = id;
      document.getElementById('deckListView').style.display = 'none';
      document.getElementById('deckDetailView').style.display = 'block';
      renderDeckDetail();
    }

    function backToDecks() {
      currentDeckId = null;
      document.getElementById('deckDetailView').style.display = 'none';
      document.getElementById('deckListView').style.display = 'block';
      renderDecks();
    }

    function renderDecks() {
      const grid = document.getElementById('deckGrid');
      grid.innerHTML = decks.length === 0 ? '<p style="color:var(--text-muted)">無單字本，請新增</p>' : '';
      grid.innerHTML = decks.map(d => `
        <div class="deck-card" onclick="openDeck(${d.id})">
          <div style="font-weight:bold; font-size:1rem; margin-bottom:6px;">📖 ${d.name}</div>
          <div style="font-size:0.8rem; color:var(--text-muted); display:flex; justify-content:space-between; align-items:center;">
            <span>${d.vocabs.length} 個單字</span>
            <button class="btn-delete" onclick="deleteDeck(${d.id}, event)">刪除</button>
          </div>
        </div>
      `).join('');
    }

    // --- 單字本內部邏輯 ---
    function renderDeckDetail() {
      const deck = decks.find(d => d.id === currentDeckId);
      if (!deck) return;

      document.getElementById('currentDeckTitle').innerText = `📖 ${deck.name}`;
      
      const doneCount = deck.vocabs.filter(v => v.done).length;
      const rate = deck.vocabs.length === 0 ? 0 : Math.round((doneCount / deck.vocabs.length) * 100);
      document.getElementById('deckProgress').innerText = `學習進度：${rate}% (已背熟 ${doneCount}/${deck.vocabs.length})`;

      const list = document.getElementById('vocabList');
      list.innerHTML = deck.vocabs.length === 0 ? '<p style="color:var(--text-muted); text-align:center;">此單字本尚無內容</p>' : '';
      list.innerHTML = deck.vocabs.map(v => `
        <div class="list-item ${v.done ? 'done' : ''}">
          <div style="display:flex; align-items:center; gap:10px;">
            <input type="checkbox" class="checkbox-custom" ${v.done ? 'checked' : ''} onchange="toggleVocabDone(${v.id})">
            <div>
              <strong style="color:var(--primary);">${v.word}</strong> - <span>${v.meaning}</span>
              <div style="font-size:0.75rem; color:var(--accent);">${calculateNextReview(v.date)}</div>
            </div>
          </div>
          <button class="btn-delete" onclick="deleteVocab(${v.id})">✕</button>
        </div>
      `).join('');
    }

    function addVocab() {
      const word = document.getElementById('vocabWord').value.trim();
      const meaning = document.getElementById('vocabMeaning').value.trim();
      const date = document.getElementById('vocabDate').value;
      if (!word || !meaning || !currentDeckId) return;

      const deck = decks.find(d => d.id === currentDeckId);
      deck.vocabs.push({ id: Date.now(), word, meaning, date, done: false });
      document.getElementById('vocabWord').value = '';
      document.getElementById('vocabMeaning').value = '';
      saveUserData();
    }

    function toggleVocabDone(vocabId) {
      const deck = decks.find(d => d.id === currentDeckId);
      const v = deck.vocabs.find(item => item.id === vocabId);
      if (v) v.done = !v.done;
      saveUserData();
    }

    function deleteVocab(vocabId) {
      const deck = decks.find(d => d.id === currentDeckId);
      deck.vocabs = deck.vocabs.filter(item => item.id !== vocabId);
      saveUserData();
    }

    // --- 艾賓浩斯遺忘曲線算法 ---
    const ebbinghausStages = [
      { name: "1. 第一遍", hours: 0 },
      { name: "2. 1hr 後複習", hours: 1 },
      { name: "3. 1天後複習", hours: 24 },
      { name: "4. 2天後複習", hours: 48 },
      { name: "5. 6天後複習", hours: 144 },
      { name: "6. 14天後複習", hours: 336 },
      { name: "7. 30天後複習", hours: 720 }
    ];

    function calculateNextReview(learnDateStr) {
      const learnTime = new Date(learnDateStr).getTime();
      const now = new Date().getTime();
      const diffHours = (now - learnTime) / (1000 * 60 * 60);

      if (isNaN(diffHours) || diffHours < 0) return "時間無效";
      let nextStage = ebbinghausStages.find(s => s.hours > diffHours);
      if (!nextStage) return "🎉 已進入長期記憶";

      const remainingHours = nextStage.hours - diffHours;
      if (remainingHours <= 1) return `⚠️ 該進行「${nextStage.name}」`;
      if (remainingHours < 24) return `🧠 下次: ${nextStage.name} (${Math.round(remainingHours)}小時後)`;
      return `🧠 下次: ${nextStage.name} (${Math.round(remainingHours / 24)}天後)`;
    }

    // --- 單字測驗 ---
    let currentQuizMode = '';
    let currentQuizItem = null;

    function startQuiz(mode) {
      const deck = decks.find(d => d.id === currentDeckId);
      if (!deck || deck.vocabs.length === 0) { alert("此單字本尚無單字可供測驗！"); return; }
      currentQuizMode = mode;
      document.getElementById('quizArea').style.display = 'block';
      nextQuestion();
    }

    function nextQuestion() {
      const deck = decks.find(d => d.id === currentDeckId);
      document.getElementById('quizResult').innerText = '';
      currentQuizItem = deck.vocabs[Math.floor(Math.random() * deck.vocabs.length)];
      const qText = document.getElementById('quizQuestion');
      const inputArea = document.getElementById('quizInputArea');

      if (currentQuizMode === 'en-zh') {
        qText.innerText = `英文：${currentQuizItem.word}`;
        inputArea.innerHTML = `<input type="text" id="quizAnswer" placeholder="輸入中文翻譯..." style="width: 80%;">`;
      } else if (currentQuizMode === 'zh-en') {
        qText.innerText = `中文：${currentQuizItem.meaning}`;
        inputArea.innerHTML = `<input type="text" id="quizAnswer" placeholder="輸入英文單字..." style="width: 80%;">`;
      } else if (currentQuizMode === 'audio') {
        qText.innerText = `🔊 聽力測試`;
        speakWord(currentQuizItem.word);
        inputArea.innerHTML = `<button onclick="speakWord('${currentQuizItem.word}')">再次播放 🔊</button><br><input type="text" id="quizAnswer" placeholder="輸入聽到的英文..." style="width: 80%; margin-top: 8px;">`;
      } else if (currentQuizMode === 'spelling') {
        qText.innerText = `拼字：${currentQuizItem.meaning}`;
        inputArea.innerHTML = `<input type="text" id="quizAnswer" placeholder="正確拼出英文..." style="width: 80%;">`;
      }
    }

    function speakWord(text) {
      const synth = window.speechSynthesis;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      synth.speak(utter);
    }

    function checkAnswer() {
      const userAns = document.getElementById('quizAnswer').value.trim().toLowerCase();
      const res = document.getElementById('quizResult');

      let isCorrect = (currentQuizMode === 'en-zh') ? currentQuizItem.meaning.includes(userAns) : (userAns === currentQuizItem.word.toLowerCase());

      if (isCorrect) {
        res.innerHTML = `<span style="color:var(--accent);">🎉 正確！${currentQuizItem.word} = ${currentQuizItem.meaning}</span>`;
        setTimeout(nextQuestion, 1500);
      } else {
        res.innerHTML = `<span style="color:var(--danger);">❌ 答錯囉！正確答案：${currentQuizItem.word} = ${currentQuizItem.meaning}</span>`;
      }
    }

    // --- To-Do List 待辦事項邏輯 ---
    function addTodo() {
      const text = document.getElementById('todoInput').value.trim();
      if (!text) return;
      todos.push({ id: Date.now(), text, done: false });
      document.getElementById('todoInput').value = '';
      saveUserData();
    }

    function toggleTodo(id) {
      const t = todos.find(item => item.id === id);
      if (t) t.done = !t.done;
      saveUserData();
    }

    function deleteTodo(id) {
      todos = todos.filter(item => item.id !== id);
      saveUserData();
    }

    function renderTodos() {
      const container = document.getElementById('todoList');
      container.innerHTML = todos.length === 0 ? '<p style="color:var(--text-muted); text-align:center;">目前沒有待辦事項！</p>' : '';
      container.innerHTML = todos.map(t => `
        <div class="list-item ${t.done ? 'done' : ''}">
          <div style="display:flex; align-items:center; gap:10px;">
            <input type="checkbox" class="checkbox-custom" ${t.done ? 'checked' : ''} onchange="toggleTodo(${t.id})">
            <span>${t.text}</span>
          </div>
          <button class="btn-delete" onclick="deleteTodo(${t.id})">✕</button>
        </div>
      `).join('');
    }

    // --- 時間圓盤圖表 ---
    function renderWheelChart() {
      const ctx = document.getElementById('wheelChart');
      if (!ctx) return;
      if (wheelChartInstance) wheelChartInstance.destroy();

      const labels = timeLogs.map(item => item.name);
      const dataValues = timeLogs.map(item => {
        if (!item.start || !item.end) return 1;
        const s = item.start.split(':');
        const e = item.end.split(':');
        let mins = (parseInt(e[0]) * 60 + parseInt(e[1])) - (parseInt(s[0]) * 60 + parseInt(s[1]));
        return mins > 0 ? mins : mins + 1440;
      });

      wheelChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels.length ? labels : ['尚未規劃'],
          datasets: [{
            data: dataValues.length ? dataValues : [1],
            backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'],
            borderWidth: 2,
            borderColor: '#1e293b'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } }
        }
      });
    }

    function renderStatsChart() {
      const ctx = document.getElementById('statsChart');
      if (!ctx) return;
      if (statsChartInstance) statsChartInstance.destroy();

      statsChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['週一', '週二', '週三', '週四', '週五', '週六', '週日'],
          datasets: [{
            label: '每日專注小時',
            data: [4, 5.5, 6, 7, 5, 8, 6.5],
            borderColor: '#3b82f6',
            backgroundColor: 'rgba(59, 130, 246, 0.15)',
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#94a3b8' } } },
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } },
            y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } }
          }
        }
      });
    }

    function addTimeLog() {
      const name = document.getElementById('timeItemName').value.trim();
      const start = document.getElementById('startTime').value;
      const end = document.getElementById('endTime').value;

      if (!name || !start || !end) return;
      timeLogs.push({ id: Date.now(), name, start, end });
      document.getElementById('timeItemName').value = '';
      saveUserData();
    }

    function deleteTimeLog(id) {
      timeLogs = timeLogs.filter(item => item.id !== id);
      saveUserData();
    }

    function renderTimeLogs() {
      const container = document.getElementById('timeLogList');
      container.innerHTML = timeLogs.map(item => `
        <div class="list-item">
          <div>
            <strong>${item.name}</strong> 
            <span style="font-size:0.8rem; color:var(--text-muted);">(${item.start} - ${item.end})</span>
          </div>
          <button class="btn-delete" onclick="deleteTimeLog(${item.id})">✕</button>
        </div>
      `).join('');
    }

    // --- 計算機 ---
    let calcExpr = '';
    function calcInput(val) {
      const screen = document.getElementById('calcScreen');
      if (val === 'C') { calcExpr = ''; screen.innerText = '0'; }
      else if (val === '=') {
        try { screen.innerText = eval(calcExpr) || '0'; calcExpr = screen.innerText; }
        catch { screen.innerText = 'Error'; calcExpr = ''; }
      } else {
        calcExpr += val;
        screen.innerText = calcExpr;
      }
    }

    updateUserUI();
    loadUserData();
  </script>
</body>
</html>
