<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura All-in-One 全功能學習與習慣空間</title>
    <!-- 必須載入 Chart.js 否則圓盤無法繪製 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --accent: #10b981;
            --danger: #ef4444;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        .user-section input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(10px);
        }

        .card-title {
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input, button, select {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        button {
            background: var(--primary);
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .chart-container {
            position: relative;
            height: 200px;
            width: 100%;
        }

        .vocab-item {
            background: rgba(15, 23, 42, 0.4);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .quiz-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-top: 15px;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .calc-screen {
            grid-column: span 4;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            color: #34d399;
            font-family: monospace;
            font-size: 1.5rem;
            text-align: right;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 5px;
        }

        .btn-calc {
            background: rgba(255, 255, 255, 0.08);
            padding: 12px;
            font-size: 1.1rem;
        }

        .btn-calc-op { background: var(--primary); }
        .delete-btn { background: transparent; color: var(--danger); font-size: 12px; padding: 2px 6px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🌸 Aura Learning & Habit Space</h1>
        <div class="user-section">
            <span id="userStatus" style="font-size: 0.85rem; color: var(--text-muted);">未登入</span>
            <input type="text" id="usernameInput" placeholder="輸入用戶名" style="width: 100px;">
            <button onclick="loginUser()">登入/切換</button>
        </div>
    </header>

    <!-- 上半部：時間紀錄與圓盤圖表 -->
    <div class="grid-2">
        <!-- 時間紀錄 -->
        <div class="card">
            <div class="card-title">⏱️ 專注與時間紀錄</div>
            <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
                <input type="text" id="timeItemName" placeholder="事項名稱 (如: 睡眠, 深度專注)" style="flex: 2;">
                <input type="time" id="startTime" style="flex: 1;">
                <input type="time" id="endTime" style="flex: 1;">
                <button onclick="addTimeLog()">加</button>
            </div>
            <div id="timeLogList" style="max-height: 180px; overflow-y: auto;"></div>
        </div>

        <!-- 時間趨勢圓盤圖表 -->
        <div class="card">
            <div class="card-title">📊 時間分配圓盤圖</div>
            <div class="chart-container">
                <canvas id="habitChart"></canvas>
            </div>
        </div>
    </div>

    <!-- 下半部：單字卡與計算機 -->
    <div class="grid-2">
        <!-- 艾賓浩斯單字本 -->
        <div class="card">
            <div class="card-title">📖 艾賓浩斯單字本</div>
            <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px;">
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="vocabWord" placeholder="英文單字 (如: apple)" style="flex:1;">
                    <input type="text" id="vocabMeaning" placeholder="中文解釋 (如: 蘋果)" style="flex:1;">
                </div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <label style="font-size: 0.8rem; color: var(--text-muted);">初學時間:</label>
                    <input type="datetime-local" id="vocabDate" style="flex:1;">
                    <button onclick="addVocab()">新增單字</button>
                </div>
            </div>

            <!-- 背誦與測驗選單 -->
            <div class="quiz-box">
                <div style="display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap;">
                    <button style="font-size: 0.75rem;" onclick="startQuiz('en-zh')">英翻中</button>
                    <button style="font-size: 0.75rem;" onclick="startQuiz('zh-en')">中翻英</button>
                    <button style="font-size: 0.75rem;" onclick="startQuiz('audio')">🔊 聽力測驗</button>
                    <button style="font-size: 0.75rem;" onclick="startQuiz('spelling')">⌨️ 拼字測驗</button>
                </div>
                <div id="quizArea" style="display: none;">
                    <div class="quiz-question" id="quizQuestion">---</div>
                    <div id="quizInputArea" style="margin-bottom: 10px;"></div>
                    <button onclick="checkAnswer()">提交答案</button>
                    <div id="quizResult" style="margin-top: 8px; font-size: 0.85rem;"></div>
                </div>
            </div>

            <div style="margin-top: 15px; max-height: 200px; overflow-y: auto;" id="vocabList"></div>
        </div>

        <!-- 輕量計算機 -->
        <div class="card">
            <div class="card-title">🧮 輕量計算機</div>
            <div class="calc-screen" id="calcScreen">0</div>
            <div class="calc-grid">
                <button class="btn-calc" onclick="calcInput('C')">C</button>
                <button class="btn-calc" onclick="calcInput('(')">(</button>
                <button class="btn-calc" onclick="calcInput(')')">)</button>
                <button class="btn-calc btn-calc-op" onclick="calcInput('/')">/</button>

                <button class="btn-calc" onclick="calcInput('7')">7</button>
                <button class="btn-calc" onclick="calcInput('8')">8</button>
                <button class="btn-calc" onclick="calcInput('9')">9</button>
                <button class="btn-calc btn-calc-op" onclick="calcInput('*')">*</button>

                <button class="btn-calc" onclick="calcInput('4')">4</button>
                <button class="btn-calc" onclick="calcInput('5')">5</button>
                <button class="btn-calc" onclick="calcInput('6')">6</button>
                <button class="btn-calc btn-calc-op" onclick="calcInput('-')">-</button>

                <button class="btn-calc" onclick="calcInput('1')">1</button>
                <button class="btn-calc" onclick="calcInput('2')">2</button>
                <button class="btn-calc" onclick="calcInput('3')">3</button>
                <button class="btn-calc btn-calc-op" onclick="calcInput('+')">+</button>

                <button class="btn-calc" onclick="calcInput('0')">0</button>
                <button class="btn-calc" onclick="calcInput('.')">.</button>
                <button class="btn-calc btn-calc-op" style="grid-column: span 2;" onclick="calcInput('=')">=</button>
            </div>
        </div>
    </div>
</div>

<script>
    // 時間初始化
    const nowISO = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    document.getElementById('vocabDate').value = nowISO;

    let currentUser = localStorage.getItem('aura_currentUser') || 'Default';
    let chartInstance = null;

    function loginUser() {
        const name = document.getElementById('usernameInput').value.trim();
        if (!name) return;
        currentUser = name;
        localStorage.setItem('aura_currentUser', currentUser);
        updateUserUI();
        loadUserData();
    }

    function updateUserUI() {
        document.getElementById('userStatus').innerText = `👤 使用者: ${currentUser}`;
    }

    // 資料管理
    let vocabs = [];
    let timeLogs = [];

    function loadUserData() {
        vocabs = JSON.parse(localStorage.getItem(`vocabs_${currentUser}`)) || [];
        timeLogs = JSON.parse(localStorage.getItem(`timeLogs_${currentUser}`)) || [
            { id: 1, name: '睡眠', start: '00:00', end: '07:00' },
            { id: 2, name: '深度專注', start: '09:00', end: '17:00' }
        ];
        renderVocabs();
        renderTimeLogs();
        initChart();
    }

    function saveUserData() {
        localStorage.setItem(`vocabs_${currentUser}`, JSON.stringify(vocabs));
        localStorage.setItem(`timeLogs_${currentUser}`, JSON.stringify(timeLogs));
        renderVocabs();
        renderTimeLogs();
        initChart();
    }

    // 圓盤圖表初始化 (Chart.js)
    function initChart() {
        const ctx = document.getElementById('habitChart');
        if (!ctx) return;

        if (chartInstance) {
            chartInstance.destroy();
        }

        const labels = timeLogs.map(item => item.name);
        const dataValues = timeLogs.map(item => {
            if (!item.start || !item.end) return 1;
            const s = item.start.split(':');
            const e = item.end.split(':');
            let mins = (parseInt(e[0]) * 60 + parseInt(e[1])) - (parseInt(s[0]) * 60 + parseInt(s[1]));
            return mins > 0 ? mins : mins + 1440;
        });

        chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels.length ? labels : ['無資料'],
                datasets: [{
                    data: dataValues.length ? dataValues : [1],
                    backgroundColor: [
                        '#6366f1', '#10b981', '#f59e0b', '#ef4444', 
                        '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'
                    ],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'right',
                        labels: { color: '#f8fafc', font: { size: 11 } }
                    }
                }
            }
        });
    }

    // 時間紀錄管理
    function addTimeLog() {
        const name = document.getElementById('timeItemName').value.trim();
        const start = document.getElementById('startTime').value;
        const end = document.getElementById('endTime').value;

        if (!name || !start || !end) {
            alert('請完整填寫事項名稱與時間！');
            return;
        }

        timeLogs.push({ id: Date.now(), name, start, end });
        document.getElementById('timeItemName').value = '';
        saveUserData();
    }

    function deleteTimeLog(id) {
        timeLogs = timeLogs.filter(item => item.id !== id);
        saveUserData();
    }

    function renderTimeLogs() {
        const container = document.getElementById('timeLogList');
        container.innerHTML = timeLogs.map(item => `
            <div class="vocab-item">
                <div>
                    <strong>${item.name}</strong> 
                    <span style="font-size:0.8rem; color:var(--text-muted);">(${item.start} - ${item.end})</span>
                </div>
                <button class="delete-btn" onclick="deleteTimeLog(${item.id})">刪除</button>
            </div>
        `).join('');
    }

    // 單字卡與計算機功能
    function addVocab() {
        const word = document.getElementById('vocabWord').value.trim();
        const meaning = document.getElementById('vocabMeaning').value.trim();
        const date = document.getElementById('vocabDate').value;
        if (!word || !meaning) return;
        vocabs.push({ id: Date.now(), word, meaning, date });
        document.getElementById('vocabWord').value = '';
        document.getElementById('vocabMeaning').value = '';
        saveUserData();
    }

    function renderVocabs() {
        const container = document.getElementById('vocabList');
        container.innerHTML = vocabs.map(v => `
            <div class="vocab-item">
                <div>
                    <strong style="color:#a5b4fc;">${v.word}</strong> - <span>${v.meaning}</span>
                </div>
                <button class="delete-btn" onclick="deleteVocab(${v.id})">刪除</button>
            </div>
        `).join('');
    }

    function deleteVocab(id) {
        vocabs = vocabs.filter(v => v.id !== id);
        saveUserData();
    }

    // 計算機邏輯
    let calcExpr = '';
    function calcInput(val) {
        const screen = document.getElementById('calcScreen');
        if (val === 'C') { calcExpr = ''; screen.innerText = '0'; }
        else if (val === '=') {
            try { screen.innerText = eval(calcExpr) || '0'; calcExpr = screen.innerText; }
            catch { screen.innerText = 'Error'; calcExpr = ''; }
        } else {
            calcExpr += val;
            screen.innerText = calcExpr;
        }
    }

    // 初始化啟動
    updateUserUI();
    loadUserData();
</script>
</body>
</html>
